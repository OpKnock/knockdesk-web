  <text x="60" y="62" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1b1b1b">Windows protected your PC</text>
  <path d="M40 36 L58 36 A2 2 0 0 0 56 38 L56 44 A2 2 0 0 0 58 46 L40 46 Z" fill="#e8e8e8"/>
  <text x="58" y="50" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#1b1b1b">&#8212;</text>
  <text x="74" y="50" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#1b1b1b">&#8211;</text>
  <rect x="72" y="106" width="52" height="52" rx="8" fill="#0f6cbd"/>
  <path d="M88 132 L96 140 L112 122" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="140" y="122" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="#1b1b1b">Microsoft Defender SmartScreen prevented an</text>
  <text x="140" y="146" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600" fill="#1b1b1b">unrecognized app from starting.</text>
  <text x="72" y="192" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#3a3a3a">Running this app might harm your computer or change the</text>
  <text x="72" y="214" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#3a3a3a">way it works. If you trust this app and its publisher, click</text>
  <text x="72" y="236" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#3a3a3a">&#8220;More info&#8221;.</text>
  <text x="72" y="272" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#3a3a3a">App:</text>
  <text x="150" y="272" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1b1b1b">KnockDesk-Setup-3.1.12-x64.exe</text>
  <text x="72" y="296" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#3a3a3a">Publisher:</text>
  <text x="150" y="296" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1b1b1b">Unknown publisher</text>
  <rect x="368" y="312" width="106" height="34" rx="4" fill="#ffffff" stroke="#d4d4d4"/>
  <text x="421" y="334" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1b1b1b">Don&#8217;t run</text>
  <rect x="482" y="312" width="98" height="34" rx="4" fill="#e5e5e5" stroke="#d4d4d4"/>
  <text x="531" y="334" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1b1b1b">More info</text>
</svg>
