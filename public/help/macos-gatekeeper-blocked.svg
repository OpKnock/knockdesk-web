<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="macOS Gatekeeper warning dialog">
  <rect width="640" height="400" fill="#2b2b2f"/>
  <rect x="90" y="48" width="460" height="300" rx="12" fill="#f6f6f6" stroke="#c9c9c9"/>
  <text x="320" y="98" text-anchor="middle" font-family="-apple-system, SF Pro Text, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1d1d1f">KnockDesk can&#8217;t be opened</text>
  <circle cx="320" y="152" r="30" fill="#d9d9de"/>
  <circle cx="320" cy="142" r="13" fill="#a6a6ad"/>
  <path d="M320 158 L320 172" stroke="#a6a6ad" stroke-width="5" stroke-linecap="round"/>
  <text x="320" y="208" text-anchor="middle" font-family="-apple-system, SF Pro Text, system-ui, sans-serif" font-size="13" fill="#3a3a3c">Apple cannot check it for malicious software.</text>
  <text x="320" y="230" text-anchor="middle" font-family="-apple-system, SF Pro Text, system-ui, sans-serif" font-size="13" fill="#3a3a3c">The developer of &#8220;KnockDesk.app&#8221; can&#8217;t be verified.</text>
  <text x="320" y="258" text-anchor="middle" font-family="-apple-system, SF Pro Text, system-ui, sans-serif" font-size="12" fill="#6e6e73">Right-click the app and choose Open to install it anyway.</text>
  <rect x="368" y="286" width="86" height="30" rx="6" fill="#e4e4e6" stroke="#c9c9c9"/>
  <text x="411" y="306" text-anchor="middle" font-family="-apple-system, SF Pro Text, system-ui, sans-serif" font-size="13" fill="#1d1d1f">OK</text>
  <rect x="460" y="286" width="74" height="30" rx="6" fill="#007aff"/>
  <text x="497" y="306" text-anchor="middle" font-family="-apple-system, SF Pro Text, system-ui, sans-serif" font-size="13" fill="#ffffff">Open</text>
</svg>
